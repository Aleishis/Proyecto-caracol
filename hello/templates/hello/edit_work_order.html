
{% include './header.html' %}

<section style="max-width: 550px; margin: 30px auto; padding: 20px;">

    <h2>Edit Work Order</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Title</label><br>
            <input type="text" name="title"
                   value="{{ order.title }}"
                   maxlength="60" required>
        </p>

        <p>
            <label>Description</label><br>
            <textarea name="description" rows="4"
                      required>{{ order.description }}</textarea>
        </p>

        <p>
            <label>Status</label><br>
            <input type="text" value="{% if order.status == 1 %}PENDING{% elif order.status == 2 %}ONGOING{% else %}FINISHED{% endif %}" disabled>
        </p>

        <p>
            <label>Responsible</label><br>
            <select name="responsible" required>
                {% for user in users %}
                    <option value="{{ user.id }}"
                        {% if user.id == order.responsible %}selected{% endif %}>
                        {{ user.name }}
                    </option>
                {% endfor %}
            </select>
        </p>

        <button type="submit" class="btn add">Save Changes</button>
        <a href="{% url 'work_orders' %}" class="btn">Cancel</a>
    </form>

</section>

</body>
</html>
