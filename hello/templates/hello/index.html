{% include './header.html' %}
{% load static %}
    
    <h1>Consulta de ordenes de trabajo</h1>

    <table class="table-user">
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Responsible</th>
            </tr>
        </thead>
        <tbody>
            {% for w in work_orders %}
            <tr>
                <td>{{w.title}}</td>
                <td>{{w.description}}</td>
                <td> {{w.status.name}}</td>
                <td>{{w.responsible}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>


    <script src="{% static 'hello/js/scripts.js'%}"></script>
</body>
</html>
