
{% include './header.html' %}

<section style="max-width: 550px; margin: 30px auto; padding: 20px;">

    <h2>Delete Work Order</h2>

    <p>Are you sure you want to delete this work order?</p>

    <h3>{{ order.title }}</h3>
    <p>{{ order.description }}</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn delete">
            Confirm Delete
        </button>

        <a href="{% url 'work_orders' %}" class="btn">
            Cancel
        </a>
    </form>

</section>

</body>
</html>
