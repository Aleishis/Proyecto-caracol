{% include './header.html' %}
{% load static %}
    
    <h1>Manage Staff</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <table class="table-user">
        <thead>
            <tr>
                <th>Name</th>
                <th>Account</th>
                <th>Profile</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{u.name}}</td>
                <td>{{u.account}}</td>
                <td>
                    {% if u.id == current_user_id %}
                        {{ u.profile.name }}
                    {% else %}
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="user_id" value="{{ u.id }}">
                        <select name="profile" required onchange="this.form.submit()">
                            {% for p in profiles %}
                                <option value="{{ p.value }}"
                                    {% if p == u.profile %}selected{% endif %}>
                                    {{ p.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </form>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>


    <script src="{% static 'hello/js/scripts.js'%}"></script>
</body>
</html>
