{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
    <title>Sign up</title>
</head>
<body>
<section class="auth-container">
    <div class="auth-card">
        <h2>Create your account</h2>
        <p>Fill out with your information.</p>

        <form method="POST" action="">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name"
                       autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       placeholder="ejemplo@correo.com"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm-password"
                       name="confirm-password"
                       placeholder="Repeat your password"
                       autocomplete="new-password"
                       minlength="8" required>
            </div>

            {% if error %}
                <p class="error-message">{{error}}</p>
            {% endif %}

            <button id="btn-register" type="submit" class="btn">Register</button>
        </form>

        <p class="auth-link">
            ¿Ya tienes cuenta?
            <a href="{% url 'index' %}">Log in here</a>
        </p>
    </div>
</section>

<script src="{% static 'hello/js/signup.js' %}"></script>

</body>
</html>
